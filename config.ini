[General]
discordUrl=https://discord.com
csfFile = general.csf

# Where game resources are located
gameresBaseUrl=/cdn/game-res/v2/
mapsBaseUrl=/cdn/maps/
modsBaseUrl=/cdn/mods/
gameResArchiveUrl=https://download.ra2web.com/full-pack.7z
patchNotesUrl=//www.ra2web.com/patch-notes.html
ladderRulesUrl=//www.ra2web.com/ladder-rules.html
modSdkUrl=https://github.com/ra2web/mod-sdk
breakingNewsUrl=/breaking-news.html
oldClientsBaseUrl=/old/
quickMatchEnabled=yes
botsEnabled=yes
debugLogging=wol
defaultLanguage=zh-CN

# 局域网对战用的 STUN。留空(或整行不写)=按本站 hostname 自动推导
# stun:<hostname>:3478，启动时探测约 2.5 秒，确认能拿到 srflx 候选才启用；
# 探测不到就按无 STUN 运行（等同原行为，同机联机不受影响）。
# 所以正常情况下只需在托管本站的机器上跑：python3 ministun.py 0.0.0.0 3478
#   off    = 强制不用 STUN
#   显式值 = 指定别的地址，例 lanStunUrl=stun:192.168.1.10:3478
# 注意：3478/udp 只能开在内网，绝不可映射到公网（无认证，会被当 UDP 反射源）。
lanStunUrl=stun:stun.cloudflare.com:3478

# 「房间码」联机的信令服务器。留空=不启用（界面只保留扫二维码）。
# 它只在入房那一瞬间转发两个字符串（一个 offer、一个 answer）；
# 对局本身仍是浏览器之间 WebRTC 直连，不经过这台服务器。
# 部署方式见 signaling/README.md，两种都行：
#   Cloudflare Workers:  wss://ra2web-signal.你的账号.workers.dev/signal
#   自建(家里的 Ubuntu):  wss://ra2.example.com/signal
# 走公网联机时记得把上面的 lanStunUrl 指到公网 STUN，例如：
#   lanStunUrl=stun:stun.cloudflare.com:3478
signalingUrl=wss://ra2web-signal.james-log22n.workers.dev/signal

viewport.width=1024
viewport.height=768
